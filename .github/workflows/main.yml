name: MoviFile Production CI/CD

on:
  push:
    branches: [ main ]

concurrency:
  group: movifile-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FRONTEND_PORT: ${{ secrets.FRONTEND_PORT || '3000' }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT || '5000' }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          ADOBE_PDF_CLIENT_ID: ${{ secrets.ADOBE_PDF_CLIENT_ID }}
          ADOBE_PDF_CLIENT_SECRET: ${{ secrets.ADOBE_PDF_CLIENT_SECRET }}
          ADOBE_ORGANIZATION_ID: ${{ secrets.ADOBE_ORGANIZATION_ID }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/movifile_deploy_key
          chmod 600 ~/.ssh/movifile_deploy_key

          FRONTEND_ENV_B64="$(printf '%s' "$FRONTEND_ENV" | base64 -w0)"
          BACKEND_ENV_B64="$(printf '%s' "$BACKEND_ENV" | base64 -w0)"
          ADOBE_PDF_CLIENT_ID_B64="$(printf '%s' "$ADOBE_PDF_CLIENT_ID" | base64 -w0)"
          ADOBE_PDF_CLIENT_SECRET_B64="$(printf '%s' "$ADOBE_PDF_CLIENT_SECRET" | base64 -w0)"
          ADOBE_ORGANIZATION_ID_B64="$(printf '%s' "$ADOBE_ORGANIZATION_ID" | base64 -w0)"

          ssh -i ~/.ssh/movifile_deploy_key \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_IP" \
            "DEPLOY_PATH='$DEPLOY_PATH' FRONTEND_PORT='$FRONTEND_PORT' BACKEND_PORT='$BACKEND_PORT' FRONTEND_ENV_B64='$FRONTEND_ENV_B64' BACKEND_ENV_B64='$BACKEND_ENV_B64' ADOBE_PDF_CLIENT_ID_B64='$ADOBE_PDF_CLIENT_ID_B64' ADOBE_PDF_CLIENT_SECRET_B64='$ADOBE_PDF_CLIENT_SECRET_B64' ADOBE_ORGANIZATION_ID_B64='$ADOBE_ORGANIZATION_ID_B64' bash -s" <<'REMOTE'
          set -e

          echo "--- Starting Deployment ---"

          if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "/" ] || [ "$DEPLOY_PATH" = "/var/www" ] || [ "$DEPLOY_PATH" = "/home" ]; then
            echo "ERROR: DEPLOY_PATH is missing or points to a shared system folder: $DEPLOY_PATH"
            exit 1
          fi

          case "$DEPLOY_PATH" in
            *movifile*|*file-converter*|*converterfile*) ;;
            *)
              echo "ERROR: DEPLOY_PATH must be a dedicated MoviFile folder, not a parent folder used by other websites."
              echo "Current DEPLOY_PATH: $DEPLOY_PATH"
              exit 1
              ;;
          esac

          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          if [ ! -d ".git" ]; then
            git clone https://github.com/basit2023/file-converter.git .
          else
            git fetch origin main
            git reset --hard origin/main
          fi

          echo "--- Environment Setup ---"
          printf '%s' "$FRONTEND_ENV_B64" | base64 -d > frontend/.env.production
          printf '%s' "$BACKEND_ENV_B64" | base64 -d > backend/.env

          set_backend_env() {
            key="$1"
            value="$2"

            if grep -q "^${key}=" backend/.env; then
              awk -v key="$key" -v value="$value" '
                $0 ~ "^" key "=" { print key "=" value; next }
                { print }
              ' backend/.env > backend/.env.tmp
              mv backend/.env.tmp backend/.env
            else
              printf "%s=%s\n" "$key" "$value" >> backend/.env
            fi
          }

          set_backend_env "PORT" "$BACKEND_PORT"
          set_backend_env "NODE_ENV" "production"

          ADOBE_PDF_CLIENT_ID="$(printf '%s' "$ADOBE_PDF_CLIENT_ID_B64" | base64 -d)"
          ADOBE_PDF_CLIENT_SECRET="$(printf '%s' "$ADOBE_PDF_CLIENT_SECRET_B64" | base64 -d)"
          ADOBE_ORGANIZATION_ID="$(printf '%s' "$ADOBE_ORGANIZATION_ID_B64" | base64 -d)"

          if [ -n "$ADOBE_PDF_CLIENT_ID" ]; then
            set_backend_env "PDF_SERVICES_CLIENT_ID" "$ADOBE_PDF_CLIENT_ID"
          fi

          if [ -n "$ADOBE_PDF_CLIENT_SECRET" ]; then
            set_backend_env "PDF_SERVICES_CLIENT_SECRET" "$ADOBE_PDF_CLIENT_SECRET"
          fi

          if [ -n "$ADOBE_ORGANIZATION_ID" ]; then
            set_backend_env "ADOBE_ORGANIZATION_ID" "$ADOBE_ORGANIZATION_ID"
          fi

          echo "--- Installing System Dependencies for Chromium and LibreOffice ---"
          sudo apt-get update -qq

          sudo apt-get install -y -qq libreoffice libreoffice-writer libreoffice-draw \
            poppler-utils fonts-liberation fonts-dejavu fonts-noto fonts-crosextra-carlito fonts-crosextra-caladea

          if apt-cache policy libasound2 | grep -q "Candidate: [^(]"; then
            ALSA_PACKAGE=libasound2
          else
            ALSA_PACKAGE=libasound2t64
          fi

          sudo apt-get install -y -qq libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxi6 libxtst6 libnss3 libcups2 libxss1 libxrandr2 \
            libatk1.0-0 libatk-bridge2.0-0 libpangocairo-1.0-0 libgtk-3-0 \
            libgbm1 ca-certificates "$ALSA_PACKAGE"

          command -v libreoffice >/dev/null || command -v soffice >/dev/null
          command -v pdftoppm >/dev/null

          echo "--- Ensuring swap is available for the build ---"
          if ! swapon --show 2>/dev/null | grep -q .; then
            echo "No active swap found, creating a 4G swapfile..."
            sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile || echo "WARNING: swapon failed (likely a memory-capped container)."
            grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          fi
          free -h || true

          echo "--- Freeing RAM: stopping running services during the build ---"
          pm2 stop movifile-frontend movifile-backend 2>/dev/null || true
          # Kill any lingering Chromium from previous conversions so it does not eat RAM during the build
          pkill -f 'chrome|chromium' 2>/dev/null || true

          echo "--- Building Frontend code ---"
          cd frontend
          export NODE_OPTIONS="--max-old-space-size=2048"
          npm ci --no-audit --no-fund
          npm run build

          echo "--- Installing Backend Dependencies ---"
          cd ../backend
          npm ci --no-audit --no-fund

          echo "--- Restarting PM2 Services ---"
          pm2 delete movifile 2>/dev/null || true
          cd "$DEPLOY_PATH/backend"
          PORT="$BACKEND_PORT" NODE_ENV=production pm2 restart movifile-backend --update-env 2>/dev/null \
          #      || PORT="$BACKEND_PORT" NODE_ENV=production pm2 start npm --name movifile-backend -- start -- -p "$BACKEND_PORT"
          cd "$DEPLOY_PATH/frontend"
          PORT="$FRONTEND_PORT" NODE_ENV=production pm2 restart movifile-frontend --update-env 2>/dev/null \
            # || PORT="$FRONTEND_PORT" NODE_ENV=production pm2 start npm --name movifile-frontend -- start -- -p "$FRONTEND_PORT"

          pm2 save
      
          echo "--- Verifying Deployment ---"
          pm2 status

          wait_for_http() {
            name="$1"
            url="$2"

            for attempt in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                echo "$name is ready: $url"
                return 0
              fi

              echo "Waiting for $name at $url (attempt $attempt/30)..."
              sleep 2
            done

            echo "ERROR: $name did not become ready: $url"
            pm2 status || true
            pm2 logs movifile-backend --lines 30 --nostream || true
            pm2 logs movifile-frontend --lines 30 --nostream || true
            ss -ltnp || true
            return 1
          }

          wait_for_http "Backend" "http://127.0.0.1:$BACKEND_PORT/health"
          wait_for_http "Frontend" "http://127.0.0.1:$FRONTEND_PORT"

          echo "--- Deployment Complete ---"
          REMOTE
